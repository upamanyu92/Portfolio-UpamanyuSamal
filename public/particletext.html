<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particle Text - 10K 3D Morph</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 20% 20%, #0f1d3d 0%, #050913 48%, #02040a 100%);
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      }

      #wrap {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
      }

      #hud {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        width: min(560px, calc(100vw - 24px));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        pointer-events: none;
      }

      #textInput {
        width: 100%;
        pointer-events: auto;
        border: 1px solid rgba(34, 211, 238, 0.45);
        border-radius: 999px;
        background: rgba(2, 6, 23, 0.72);
        color: #7dd3fc;
        text-align: center;
        font-size: 15px;
        padding: 13px 18px;
        outline: none;
        backdrop-filter: blur(5px);
      }

      #textInput:focus {
        border-color: rgba(34, 211, 238, 0.9);
        box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15);
      }

      #hint {
        color: rgba(148, 163, 184, 0.88);
        font-size: 12px;
        text-align: center;
        letter-spacing: 0.01em;
      }

      #badge {
        position: absolute;
        top: 14px;
        right: 14px;
        color: rgba(148, 163, 184, 0.82);
        font-size: 11px;
        line-height: 1.35;
        text-align: right;
        user-select: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="scene"></canvas>

      <div id="hud">
        <input id="textInput" type="text" maxlength="120" aria-label="Type text to morph particles" placeholder="Type to morph 10,000 particles..." />
        <div id="hint">Move cursor over text to repel particles · Double-click anywhere to reset</div>
      </div>

      <div id="badge">10,000 particles · Canvas + Typed Arrays · 3D projection</div>
    </div>

    <script>
      const N = 10000;
      const FOV = 550;
      const CAMERA_Z = 600;
      const REPEL_RADIUS = 100;
      const REPEL_FORCE = 8;
      const SAMPLE_STEP = 3;
      const ALPHA_THRESHOLD = 120;
      const SPHERE_SPRING = 0.02;
      const TEXT_SPRING = 0.022;
      const FRICTION = 0.82;
      const ORBITAL_JITTER = 1.8;

      const canvas = document.getElementById("scene");
      const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
      const input = document.getElementById("textInput");

      const textCanvas = document.createElement("canvas");
      const textCtx = textCanvas.getContext("2d", { willReadFrequently: true });

      const px = new Float32Array(N);
      const py = new Float32Array(N);
      const pz = new Float32Array(N);
      const vx = new Float32Array(N);
      const vy = new Float32Array(N);
      const vz = new Float32Array(N);
      const tx = new Float32Array(N);
      const ty = new Float32Array(N);
      const tz = new Float32Array(N);
      const ox = new Float32Array(N);
      const oy = new Float32Array(N);
      const oz = new Float32Array(N);
      const hue = new Float32Array(N);
      const phase = new Float32Array(N);

      let appState = 0;
      let rotY = 0;
      let dpr = 1;
      let vw = 0;
      let vh = 0;
      let radius = 220;
      let mouseX = -9999;
      let mouseY = -9999;
      let t = 0;

      function shuffleUint32(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = (Math.random() * (i + 1)) | 0;
          const temp = arr[i];
          arr[i] = arr[j];
          arr[j] = temp;
        }
      }

      function buildSphere(R) {
        const golden = Math.PI * (3 - Math.sqrt(5));
        for (let i = 0; i < N; i++) {
          const y = 1 - (i / (N - 1)) * 2;
          const r = Math.sqrt(Math.max(0, 1 - y * y));
          const theta = golden * i;
          ox[i] = Math.cos(theta) * r * R;
          oy[i] = y * R;
          oz[i] = Math.sin(theta) * r * R;
        }
      }

      function resetToSphere() {
        appState = 0;
        for (let i = 0; i < N; i++) {
          tx[i] = ox[i];
          ty[i] = oy[i];
          tz[i] = oz[i];
        }
      }

      function wrapText(text, maxChars) {
        const words = text.trim().split(/\s+/).filter(Boolean);
        if (words.length === 0) return [];

        const lines = [];
        let line = "";

        for (const word of words) {
          if (word.length > maxChars) {
            if (line) {
              lines.push(line);
              line = "";
            }
            for (let i = 0; i < word.length; i += maxChars) {
              lines.push(word.slice(i, i + maxChars));
            }
            continue;
          }

          const next = line ? line + " " + word : word;
          if (next.length <= maxChars) {
            line = next;
          } else {
            lines.push(line);
            line = word;
          }
        }

        if (line) lines.push(line);
        return lines;
      }

      function sampleText(text) {
        const maxChars = Math.max(8, Math.min(20, Math.floor(vw / 42)));
        const lines = wrapText(text, maxChars);
        if (!lines.length) return null;

        textCanvas.width = vw;
        textCanvas.height = vh;
        textCtx.clearRect(0, 0, vw, vh);

        const longest = lines.reduce((m, line) => Math.max(m, line.length), 1);
        const lineCount = lines.length;
        const fontSize = Math.max(
          26,
          Math.min(122, Math.floor(Math.min((vw * 0.88) / longest * 1.6, (vh * 0.6) / Math.max(1, lineCount * 0.95))))
        );

        const lineHeight = fontSize * 1.18;
        const blockH = lineHeight * lineCount;
        const startY = vh * 0.5 - blockH * 0.5 + lineHeight * 0.5;

        textCtx.fillStyle = "#fff";
        textCtx.textAlign = "center";
        textCtx.textBaseline = "middle";
        textCtx.font = `900 ${fontSize}px Arial Black, Arial, sans-serif`;

        for (let i = 0; i < lineCount; i++) {
          textCtx.fillText(lines[i], vw * 0.5, startY + i * lineHeight);
        }

        const image = textCtx.getImageData(0, 0, vw, vh).data;
        const xs = [];
        const ys = [];

        for (let y = 0; y < vh; y += SAMPLE_STEP) {
          for (let x = 0; x < vw; x += SAMPLE_STEP) {
            const alpha = image[(y * vw + x) * 4 + 3];
            if (alpha > ALPHA_THRESHOLD) {
              xs.push(x - vw * 0.5 + (Math.random() - 0.5) * 0.4);
              ys.push(y - vh * 0.5 + (Math.random() - 0.5) * 0.4);
            }
          }
        }

        if (xs.length === 0) return null;
        return { xs, ys };
      }

      function applyText(text) {
        const pts = sampleText(text);
        if (!pts) {
          resetToSphere();
          return;
        }

        appState = 1;
        const len = pts.xs.length;
        const order = new Uint32Array(len);
        for (let i = 0; i < len; i++) order[i] = i;
        shuffleUint32(order);

        for (let i = 0; i < N; i++) {
          const id = order[i % len];
          tx[i] = pts.xs[id];
          ty[i] = pts.ys[id];
          tz[i] = 0;
        }
      }

      function resize() {
        dpr = Math.max(1, Math.min(2.5, window.devicePixelRatio || 1));
        vw = Math.max(1, Math.floor(window.innerWidth));
        vh = Math.max(1, Math.floor(window.innerHeight));

        canvas.width = Math.floor(vw * dpr);
        canvas.height = Math.floor(vh * dpr);
        canvas.style.width = `${vw}px`;
        canvas.style.height = `${vh}px`;

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);

        const baseDim = Math.min(vw, vh);
        radius = baseDim > 1200 ? baseDim * 0.28 : baseDim * 0.42;
        buildSphere(radius);

        if (appState === 0) {
          resetToSphere();
        } else {
          const currentText = input.value.trim();
          if (currentText) applyText(currentText);
        }
      }

      function pointerMove(e) {
        const rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
      }

      function clearPointer() {
        mouseX = -9999;
        mouseY = -9999;
      }

      function animate() {
        const cx = vw * 0.5;
        const cy = vh * 0.5;

        ctx.clearRect(0, 0, vw, vh);

        const spring = appState === 0 ? SPHERE_SPRING : TEXT_SPRING;

        if (appState === 0) {
          rotY += 0.006;
          const cosR = Math.cos(rotY);
          const sinR = Math.sin(rotY);
          for (let i = 0; i < N; i++) {
            const x = ox[i];
            const z = oz[i];
            tx[i] = x * cosR - z * sinR;
            tz[i] = x * sinR + z * cosR;
            ty[i] = oy[i];
          }
        }

        if (appState === 1) {
          ctx.fillStyle = "hsl(190,90%,85%)";
        }

        for (let i = 0; i < N; i++) {
          let ax = (tx[i] - px[i]) * spring;
          let ay = (ty[i] - py[i]) * spring;
          let az = (tz[i] - pz[i]) * spring;

          if (appState === 0) {
            const wobble = Math.sin(t * 0.03 + phase[i]) * ORBITAL_JITTER;
            ax += wobble * 0.01;
            ay += wobble * 0.01;
          } else {
            const z = pz[i] + CAMERA_Z;
            const inv = FOV / z;
            const sx = px[i] * inv + cx;
            const sy = py[i] * inv + cy;
            const dx = sx - mouseX;
            const dy = sy - mouseY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist > 0 && dist < REPEL_RADIUS) {
              const force = REPEL_FORCE * (1 - dist / REPEL_RADIUS) * 5;
              ax += (dx / dist) * force;
              ay += (dy / dist) * force;
            }
          }

          vx[i] = (vx[i] + ax) * FRICTION;
          vy[i] = (vy[i] + ay) * FRICTION;
          vz[i] = (vz[i] + az) * FRICTION;

          px[i] += vx[i];
          py[i] += vy[i];
          pz[i] += vz[i];

          const z = pz[i] + CAMERA_Z;
          if (z <= 0) continue;

          const scale = FOV / z;
          const sx = px[i] * scale + cx;
          const sy = py[i] * scale + cy;
          const size = Math.max(0.8, scale * 1.3);

          if (appState === 0) {
            ctx.fillStyle = `hsl(${(hue[i] + t * 25) % 360},80%,65%)`;
          }
          ctx.fillRect(sx, sy, size, size);
        }

        t += 1;
        requestAnimationFrame(animate);
      }

      for (let i = 0; i < N; i++) {
        hue[i] = Math.random() * 360;
        phase[i] = Math.random() * Math.PI * 2;
      }

      resize();
      for (let i = 0; i < N; i++) {
        px[i] = ox[i]; py[i] = oy[i]; pz[i] = oz[i];
        tx[i] = ox[i]; ty[i] = oy[i]; tz[i] = oz[i];
      }

      input.addEventListener("input", (e) => {
        const text = e.target.value.trim();
        if (!text) {
          resetToSphere();
        } else {
          applyText(text);
        }
      });

      canvas.addEventListener("pointermove", pointerMove);
      canvas.addEventListener("pointerleave", clearPointer);

      window.addEventListener("resize", resize);
      window.addEventListener("dblclick", () => {
        input.value = "";
        resetToSphere();
      });

      requestAnimationFrame(animate);
    </script>
  </body>
</html>
